version: "3.8"

services:
  dashboards-desligamentos:
    build:
      context: .
      dockerfile: dockerfile
    restart: unless-stopped
    expose:
      - "8501"
    networks:
      - default

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8096:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dashboards-desligamentos
    networks:
      - default

networks:
  default:
    external: true
    name: dashboards-desligamento_default
