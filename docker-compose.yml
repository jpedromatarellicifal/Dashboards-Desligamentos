version: "3.8"

services:
  dashboards-desligamentos:
    build:
      context: .
      dockerfile: dockerfile
    image: dashboards-desligamentos-app:v2
    restart: unless-stopped
    expose:
      - "8501"
    networks:
      - default

  nginx:
    build:
      context: .
      dockerfile: nginx.Dockerfile
    image: dashboards-desligamentos-nginx:v2
    restart: unless-stopped
    ports:
      - "8096:80"
    depends_on:
      - dashboards-desligamentos
    networks:
      - default

networks:
  default:
    external: true
    name: dashboards-desligamento_default
