server {
    listen 80;
    server_name localhost;

    # Aumenta o tempo de timeout para sessões longas do Streamlit
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;

    location / {
        proxy_pass http://dashboards-desligamentos:8501;

        # Headers essenciais para o Streamlit funcionar corretamente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configuração obrigatória para WebSockets (mantém o session_state vivo)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Desativa buffering para melhor performance em tempo real
        proxy_buffering off;
    }
}
